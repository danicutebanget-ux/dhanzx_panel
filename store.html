<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNZ|PREM - Linktree Premium APK</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            color: white;
            overflow-x: hidden;
        }

        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .logo {
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff, #f0f9ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1.5rem;
            letter-spacing: -1px;
            text-shadow: 0 10px 30px rgba(255,255,255,0.3);
        }

        .subtitle {
            font-size: 1.1rem;
            font-weight: 400;
            opacity: 0.9;
            margin-bottom: 3rem;
            font-weight: 300;
        }

        /* Search Bar */
        .search-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 1rem 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .search-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .search-container:hover::before {
            left: 100%;
        }

        .search-container:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            background: rgba(255, 255, 255, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
            opacity: 0.8;
        }

        .search-input {
            background: none;
            border: none;
            color: white;
            font-size: 1rem;
            width: 100%;
            padding: 0.5rem 0 0.5rem 2.5rem;
            outline: none;
            font-family: inherit;
        }

        .search-input::placeholder {
            color: rgba(255,255,255,0.7);
        }

        /* Action Buttons */
        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 1.2rem 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            height: 70px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .action-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.6s;
        }

        .action-btn:hover::before {
            left: 100%;
        }

        .action-btn:hover {
            transform: translateY(-5px) scale(1.02);
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        .action-btn i {
            font-size: 1.4rem;
            width: 24px;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                padding: 0 1rem;
            }
            
            .action-btn {
                padding: 1rem;
                font-size: 1rem;
                height: 65px;
            }
            
            .logo {
                margin-bottom: 1rem;
            }
        }

        /* Floating Animation */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .container {
            animation: float 6s ease-in-out infinite;
        }

        /* Custom WhatsApp & TikTok Icons */
        .whatsapp-icon {
            background: linear-gradient(135deg, #25D366, #128C7E);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 1.5rem;
        }

        .tiktok-icon {
            background: linear-gradient(135deg, #000000, #ff0050);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo -->
        <h1 class="logo">DNZ|PREM</h1>
        <p class="subtitle">Toko APK Premium Terpercaya</p>

        <!-- Search Bar - WhatsApp Group -->
        <div class="search-container" onclick="window.open('https://chat.whatsapp.com/KBOGWOmMYer8XtBHoF6T3l?mode=gi_t', '_blank')">
            <i class="fas fa-search search-icon"></i>
            <input type="text" class="search-input" placeholder="Tempat Order Utama" readonly>
        </div>

        <!-- Order APK Button -->
        <a href="https://wa.me/6288973654391?text=Hi%20admin%20DNZ|PREM,%20saya%20mau%20order%20APK%20Premium" 
           class="action-btn" target="_blank">
            <i class="fab fa-whatsapp whatsapp-icon"></i>
            <span>Order APK Prem di Sini</span>
        </a>

        <!-- TikTok Button -->
        <a href="https://www.tiktok.com/@_dhanzx4" class="action-btn" target="_blank">
            <i class="fab fa-tiktok tiktok-icon"></i>
            <span>Follow TikTok Mimin</span>
        </a>
    </div>

    <script>
        // Smooth hover effects
        document.querySelectorAll('.action-btn, .search-container').forEach(el => {
            el.addEventListener('mouseenter', function() {
                this.style.transform = 'translateY(-5px) scale(1.02)';
            });
            
            el.addEventListener('mouseleave', function() {
                this.style.transform = 'translateY(0) scale(1)';
            });
        });

        // Auto focus effect on search bar
        const searchInput = document.querySelector('.search-input');
        searchInput.addEventListener('click', function(e) {
            e.stopPropagation();
            window.open('https://chat.whatsapp.com/KBOGWOmMYer8XtBHoF6T3l?mode=gi_t', '_blank');
        });

        // Preload links for faster opening
        document.addEventListener('DOMContentLoaded', function() {
            // Simulate typing effect on logo (optional)
            const logo = document.querySelector('.logo');
            logo.style.opacity = '0';
            logo.style.transform = 'translateY(20px)';
            setTimeout(() => {
                logo.style.transition = 'all 0.8s ease';
                logo.style.opacity = '1';
                logo.style.transform = 'translateY(0)';
            }, 200);
        });
    </script>
</body>
</html>
